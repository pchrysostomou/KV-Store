[package]
name = "kv-store"
version = "0.1.0"
edition = "2021"
default-run = "kvctl"

[lib]
name = "kv_store"
path = "src/lib.rs"

[[bin]]
name = "kvctl"
path = "src/main.rs"

[dependencies]
axum = "0.6"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
prometheus = "0.13"
prost = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tempfile = "3"
