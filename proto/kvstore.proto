syntax = "proto3";

package kvstore.v1;

service KvStore {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Scan(ScanRequest) returns (stream ScanResponse);
  rpc Flush(FlushRequest) returns (FlushResponse);
  rpc Compact(CompactRequest) returns (CompactResponse);
  rpc Stats(StatsRequest) returns (StatsResponse);
  rpc Watch(WatchRequest) returns (stream WatchResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value = 1;
  bool found = 2;
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  bool success = 1;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
}

message ScanRequest {
  string prefix = 1;
  uint32 limit = 2;
}

message ScanResponse {
  string key = 1;
  string value = 2;
}

message FlushRequest {}

message FlushResponse {
  bool flushed = 1;
  uint64 sstable_id = 2;
  uint64 entries = 3;
}

message CompactRequest {}

message CompactResponse {
  bool flushed_memtable = 1;
  uint64 input_sstables = 2;
  uint64 output_sstables = 3;
  uint64 input_entries = 4;
  uint64 output_entries = 5;
  uint64 dropped_entries = 6;
}

message StatsRequest {}

message StatsResponse {
  uint64 memtable_entries = 1;
  uint64 memtable_bytes = 2;
  uint64 flush_threshold_bytes = 3;
  bool should_flush = 4;
  uint64 sstable_count = 5;
  uint64 bloom_filter_count = 6;
  uint64 next_sstable_id = 7;
}

message WatchRequest {
  string prefix = 1;
}

message WatchResponse {
  string key = 1;
  string value = 2;
  WatchEvent event = 3;
}

enum WatchEvent {
  WATCH_EVENT_UNSPECIFIED = 0;
  WATCH_EVENT_PUT = 1;
  WATCH_EVENT_DELETE = 2;
}
